<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Amazon Travel Product</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 40px 20px; background: #f6f7f9; color: #1f2937; }
    .card { max-width: 620px; margin: auto; background: #fff; padding: 28px; border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,.08); }
    h1 { margin-top: 0; font-size: 26px; }
    p { line-height: 1.6; }
    .amazon-btn { display: inline-block; padding: 13px 22px; background: #ff9900; color: #111; text-decoration: none; border-radius: 7px; font-weight: 700; }
    .disclosure { font-size: 12px; color: #6b7280; margin-top: 22px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Amazon Basics 21-Inch Carry-On Luggage</h1>
    <p>Expandable carry-on luggage with multi-directional wheels and a scratch-resistant surface.</p>
    <a class="amazon-btn"
       href="https://amzn.to/4AUcpLI"
       target="_blank"
       rel="nofollow sponsored noopener">
      🛒 Check Price on Amazon
    </a>
    <p class="disclosure">As an Amazon Associate I earn from qualifying purchases.</p>
  </main>
</body>
</html>
